services:
  aski-water-watch:
    build: .
    container_name: aski-water-watch
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    volumes:
      - aski-data:/data
    networks:
      - homebot

networks:
  homebot:
    external: true

volumes:
  aski-data:
